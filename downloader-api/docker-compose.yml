# Run the downloader (API + web UI) on http://localhost:8000
#   cd downloader-api && docker compose up -d --build
services:
  downloader:
    build:
      context: ..
      dockerfile: downloader-api/Dockerfile
    image: itzi-downloader
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Browser origins allowed to call the API (the GitHub Pages site + this server).
      ALLOWED_ORIGINS: "https://itzigroup.com,https://www.itzigroup.com,http://localhost:8000"
      # Set to 1 when running behind a reverse proxy (Caddy, Nginx, Cloudflare…).
      TRUST_PROXY: "0"
      # Optional: logged-in cookies for Instagram stories, private posts, etc.
      # COOKIES_FILE: /secrets/cookies.txt
      # Optional: route platform traffic through a proxy if your server IP gets blocked.
      # OUTBOUND_PROXY: "http://user:pass@proxy.example:8080"
    volumes:
      - downloader-data:/data
      # - ./cookies.txt:/secrets/cookies.txt:ro

volumes:
  downloader-data:
